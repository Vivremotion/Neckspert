<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-4-full-bleed-lane.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#e89868}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <figure class="r-field region plate" data-region="field"><img src="../../../assets/plates/field.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-prompt-note region text" data-region="prompt-note"><!-- Giant note F with drop shadow --><p style="line-height:1.05;margin:0">prompt-note</p></div>
  <div class="r-prompt-string region text" data-region="prompt-string"><!-- String label, corde de B --><p style="font-size:var(--r-prompt-string-font);font-family:var(--r-prompt-string-family),sans-serif;font-weight:var(--r-prompt-string-weight);line-height:1.05;margin:0">prompt-string</p></div>
  <div class="r-verdict-box region chrome" data-region="verdict-box"><!-- Double frame around the verdict --></div>
  <figure class="r-verdict-sprite region plate" data-region="verdict-sprite"><img src="../../../assets/plates/verdict-sprite.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-verdict-banner region text" data-region="verdict-banner"><!-- Inverted banner EN RETARD --><p style="font-size:var(--r-verdict-banner-font);line-height:1.05;margin:0">verdict-banner</p></div>
  <div class="r-verdict-offset region text" data-region="verdict-offset"><!-- Timing offset +95 ms --><p style="font-size:var(--r-verdict-offset-font);line-height:1.05;margin:0">verdict-offset</p></div>
  <div class="r-verdict-reaction region text" data-region="verdict-reaction"><!-- Reaction time 1,21 s --><p style="line-height:1.05;margin:0">verdict-reaction</p></div>
  <figure class="r-lane-bed region plate" data-region="lane-bed"><img src="../../../assets/plates/lane-bed.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-lane-heart region chrome" data-region="lane-heart"><!-- Heart above the finish line --></div>
  <figure class="r-lane-history region plate" data-region="lane-history"><img src="../../../assets/plates/lane-history.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-lane-finish region chrome" data-region="lane-finish"><!-- Finish line and the tile just left of it --></div>
  <figure class="r-lane-upcoming region plate" data-region="lane-upcoming"><img src="../../../assets/plates/lane-upcoming.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-lane-label region text" data-region="lane-label"><!-- MESURE 2/2 TEMPS 3/4 --><p style="line-height:1.05;margin:0">lane-label</p></div>
  <div class="r-lane-target region text" data-region="lane-target"><!-- Inverted target tile F --><p style="line-height:1.05;margin:0">lane-target</p></div>
</main>
</body>
</html>
